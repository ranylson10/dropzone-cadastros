<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: http://127.0.0.1:*; frame-src http://127.0.0.1:*; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DropZone Live Local</title><link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="login-gate" class="login-gate hidden">
      <form id="login-form" class="login-card">
        <div class="dz-mark">DZ</div><h1>DropZone Live</h1><p>Entre com sua conta para abrir suas produções.</p>
        <label>Perfil<select id="login-profile"><option value="produtora">Produtora</option><option value="manager">Manager</option><option value="broadcast">Broadcast</option><option value="equipe">Equipe</option><option value="jogador">Jogador</option></select></label>
        <label>Login ou e-mail<input id="login-name" autocomplete="username" required /></label>
        <label>Senha<input id="login-password" type="password" autocomplete="current-password" required /></label>
        <button class="accent" type="submit">Entrar</button>
        <div class="login-divider"><span>ou</span></div>
        <button id="google-login" class="google-login" type="button">G&nbsp;&nbsp;Continuar com Google</button><small id="login-error"></small>
      </form>
    </section>

    <div id="app" class="app hidden">
      <header class="menu"><div class="brand"><span>DZ</span><b>DropZone Live</b></div><nav><button>Arquivo</button><button class="active">Início</button><button>Estilo</button><button>Dados</button></nav><div class="account"><span id="account-name"></span><button id="logout" title="Sair">↪</button></div></header>
      <section class="ribbon"><div class="ribbon-tools"><button id="new-live" title="Nova produção">＋</button><button id="save-live" title="Salvar">▣</button><button id="sync-live" title="Atualizar dados">↻</button><button id="export-png" title="Exportar PNG">⇩</button><button id="copy-output" title="Copiar link OBS/vMix">⧉</button></div><div class="ribbon-sep"></div><select id="championship-select" title="Campeonato autorizado"><option value="">Arte livre</option></select><div class="ribbon-sep"></div><div id="quick-properties" class="quick-properties"><input id="tool-x" type="number" title="X" placeholder="X" /><input id="tool-y" type="number" title="Y" placeholder="Y" /><input id="tool-w" type="number" title="Largura" placeholder="L" /><input id="tool-h" type="number" title="Altura" placeholder="A" /></div><span id="sync-status" class="status">—</span></section>
      <main id="workspace" class="workspace hidden">
        <aside class="toolrail"><button data-add="text" title="Texto">T</button><button data-add="table" title="Tabela">▦</button><button id="add-image" title="Imagem local">▣</button></aside>
        <section class="canvas-wrap"><div class="canvas-title"><span id="live-title">Sem título</span><button id="open-output" title="Abrir saída">↗</button></div><div id="design-surface" class="design-surface"><iframe id="overlay-preview" title="Prévia local"></iframe><div id="selection-layer" class="selection-layer"></div></div><div class="canvas-footer"><code id="output-url">—</code></div></section>
        <aside class="layers"><header><button id="add-layer" title="Adicionar">＋</button><span>Camadas</span></header><div id="block-list" class="block-list"></div><div id="block-editor" class="block-editor"></div></aside>
      </main>
      <section id="empty-state" class="empty hidden"><button id="empty-new-live" class="accent">Criar produção</button></section>
    </div>

    <dialog id="live-dialog"><form method="dialog" id="create-form"><h2>Nova produção</h2><input id="new-live-name" required maxlength="80" placeholder="Nome" /><select id="new-championship-select"><option value="">Arte livre</option></select><footer><button value="cancel">Cancelar</button><button class="accent" value="default">Criar</button></footer></form></dialog>
    <div id="toast" class="toast hidden"></div><script src="renderer.js"></script>
  </body>
</html>
