<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#15181d" fill-opacity="0.22"/>
      <circle cx="9" cy="9" r="1.15" fill="#f0c800" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="320" height="220" fill="url(#fade)"/></mask>
  </defs>
  <rect width="320" height="220" fill="url(#dots)" mask="url(#m)"/>
</svg>
