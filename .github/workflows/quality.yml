name: Quality
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  experience:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-public-key
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder-server-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config=playwright.experience.config.ts
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npm run test:security
      - run: npm run test:rounds
      - run: npm run test:round13
      - run: npm run test:round14
      - run: npm run test:round15
      - run: npm run test:round16
      - run: npm run test:round17
      - run: npm run test:round18
      - run: npm run test:round19
      - run: npm run test:round19:buildfix
      - run: npm run test:round20
      - run: npm run test:round21
      - run: npm run test:round22
      - run: npm run test:round23
      - run: npm run test:round24
      - run: npm run audit:theme-contract
      - run: npm run typecheck
      - run: npm run lint
      # Code validation only: the owner declined the root registry audit.
      # Keep that query manual; this job does not certify dependency advisories.
      # Production prerendering needs project data. Compile here without giving
      # privileged database credentials to code from pull requests.
      - run: npm run build --workspace dropzone-web -- --experimental-build-mode compile
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-public-key
